name: Bug Report
description: Create a report to help us fix an unexpected error or incorrect behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or input data to reproduce the behavior.
      placeholder: |
        1. Launch application
        2. Enter baseline record with Name '...'
        3. Enter submission record with Name '...'
        4. See incorrect score
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Java version (e.g. OpenJDK 21.0.2), and Maven version.
      placeholder: macOS 14.5, OpenJDK 21.0.2
    validations:
      required: true

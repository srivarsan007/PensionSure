name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.platform-name }} package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            javafx-platform: linux
            platform-name: linux
          - os: windows-latest
            javafx-platform: win
            platform-name: windows
          - os: macos-latest
            javafx-platform: mac-aarch64
            platform-name: macos-arm64
          - os: macos-13
            javafx-platform: mac
            platform-name: macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Extract release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for Maven wrapper (Unix)
        if: runner.os != 'Windows'
        run: chmod +x mvnw

      - name: Build standalone JAR (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./mvnw -B clean package -DskipTests -Djavafx.platform=${{ matrix.javafx-platform }}
          VERSION="${{ steps.version.outputs.version }}"
          ASSET_NAME="pensionsure-${VERSION}-${{ matrix.platform-name }}.jar"
          cp target/pensionsure-${VERSION}.jar "${ASSET_NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          else
            shasum -a 256 "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          fi

      - name: Build standalone JAR (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmd.exe /c "mvnw.cmd -B clean package -DskipTests -Djavafx.platform=${{ matrix.javafx-platform }}"
          VERSION="${{ steps.version.outputs.version }}"
          ASSET_NAME="pensionsure-${VERSION}-${{ matrix.platform-name }}.jar"
          cp target/pensionsure-${VERSION}.jar "${ASSET_NAME}"
          sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"

      - name: Upload artifact for publishing
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform-name }}
          path: |
            pensionsure-*.jar
            pensionsure-*.jar.sha256
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-dist

      - name: Verify release artifacts
        run: |
          ls -lh release-dist/
          cd release-dist
          sha256sum -c *.sha256

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          cd release-dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" * --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" * \
              --title "PensionSure ${VERSION}" \
              --generate-notes
          fi
